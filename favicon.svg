<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <rect width="48" height="48" fill="#ffffff"/>
  <!-- Navy A (two legs meeting at apex, no crossbar gap — swoosh replaces it) -->
