<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="72" fill="#1a2f5e"/>

  <!-- A shape — wide elegant letter -->
  <polygon points="256,52 400,400 334,400 256,178 178,400 112,400" fill="#f0f0f0"/>
  <!-- A crossbar cut-out -->
  <rect x="180" y="268" width="152" height="38" fill="#1a2f5e"/>

  <!-- Gold swoosh arc through the A -->
  <path d="M68,236 Q170,108 432,192"
        stroke="#c9a84c" stroke-width="24" fill="none"
        stroke-linecap="round"/>

  <!-- ANNU lettering below -->
  <text x="256" y="462" font-family="Arial Black, Arial, sans-serif" font-size="58"
        font-weight="900" fill="#f0f0f0" text-anchor="middle" letter-spacing="14">ANNU</text>
</svg>
